app = "ez-degree-gmu"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  JPA_DDL_AUTO = "update"
  JWT_EXPIRATION = "604800000"
  DEMO_USERNAME = "judge"
  PROJECT_DATA_PATH = "/app/AllData"
  FRONTEND_URL = "https://ez-degree-gmu.fly.dev"
  FRONTEND_ORIGINS = "https://ez-degree-gmu.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "1m"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"
  cpus = 2
